name: Rust Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/rust-ci.yml

  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "v${crate}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}"
            exit 1
          fi

  build:
    needs: [ci, verify-version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --bin penoos-runner --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          name="penoos-runner-${GITHUB_REF_NAME}-${{ matrix.target }}"
          src="target/${{ matrix.target }}/release"
          mkdir dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cp "${src}/penoos-runner.exe" dist/
            (cd dist && 7z a "../${name}.zip" penoos-runner.exe)
          else
            cp "${src}/penoos-runner" dist/
            tar -czf "${name}.tar.gz" -C dist penoos-runner
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: penoos-runner-*.*

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum penoos-runner-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/penoos-runner-*
            dist/SHA256SUMS
          generate_release_notes: true
