[package]
name = "penoos"
version = "0.1.0"
edition = "2021"
description = "Fast & powerful microservices framework for Rust"
license = "MIT"
authors = ["Penoos Team <https://github.com/lenoos-soutions/penoos>"]
repository = "https://github.com/lenoos-soutions/penoos"
homepage = "https://github.com/lenoos-soutions/penoos"
documentation = "https://docs.rs/penoos"
keywords = ["microservices", "framework", "rpc", "messaging", "async"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]


[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
once_cell = "1.0"
parking_lot = "0.12"
dashmap = "5.0"
reqwest = { version = "0.11", features = ["json"] }
redis = { version = "0.23", optional = true, features = ["aio", "tokio-comp"] }
bincode = { version = "1.3", optional = true }
glob = "0.3"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.16", features = ["derive"] }
metrics = "0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
hostname = "0.3"
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["redis-cache", "bincode-serializer"]
redis-cache = ["redis"]
bincode-serializer = ["bincode"]
tcp-transport = []
nats-transport = []
msgpack = []



[[bin]]
name = "penoos-runner"
path = "src/bin/penoos-runner.rs"

[lib]
name = "penoos"
path = "src/lib.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "math_service"
path = "examples/math_service.rs"
