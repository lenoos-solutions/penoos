[package]
name = "penoos"
version = "0.1.0"
edition = "2024"
description = "Fast & powerful microservices framework for Rust"
license = "MIT"
authors = ["Penoos Team <https://github.com/lenoos-soutions/penoos>"]
repository = "https://github.com/lenoos-soutions/penoos"
homepage = "https://github.com/lenoos-soutions/penoos"
documentation = "https://docs.rs/penoos"
keywords = ["microservices", "framework", "rpc", "messaging", "async"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]


[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11.11"
thiserror = "2.0.21"
anyhow = "1.0"
futures = "0.3"
once_cell = "1.0"
parking_lot = "0.13.0"
dashmap = "6.2.1"
reqwest = { version = "0.13.5", features = ["json"] }
redis = { version = "1.8.1", optional = true, features = ["aio", "tokio-comp"] }
oxicode = { version = "0.2", optional = true, features = ["serde"] }
wincode = { version = "0.6", optional = true }
postcard = { version = "1.1", optional = true, features = ["use-std"] }
glob = "0.3"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.21.0", features = ["derive"] }
metrics = "0.24.6"
tracing = "0.1"
tracing-subscriber = "0.3"
hostname = "0.4.2"
rand = "0.10.3"
clap = { version = "4.0", features = ["derive"] }
toml = "1.2.1+spec-1.1.0"
rmp-serde = { version = "1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
default = ["redis-cache", "macros"]
redis-cache = ["redis"]
oxicode-serializer = ["dep:oxicode"]
wincode-serializer = ["dep:wincode"]
postcard-serializer = ["dep:postcard"]
tcp-transport = []
nats-transport = []
msgpack = ["dep:rmp-serde"]
test_macros = []
macros = ["test_macros"]
full = ["redis-cache", "oxicode-serializer", "wincode-serializer", "postcard-serializer", "tcp-transport", "nats-transport", "msgpack", "macros"]


[[bin]]
name = "penoos-runner"
path = "src/bin/penoos-runner.rs"

[lib]
name = "penoos"
path = "src/lib.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "math_service"
path = "examples/math_service.rs"
